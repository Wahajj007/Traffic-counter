<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Traffic Counter</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #0b0c0e;
    --surface: #131417;
    --surface-2: #1a1c20;
    --border: #26282e;
    --text: #e8e9eb;
    --text-dim: #9a9ca3;
    --text-faint: #5f6169;
    --accent: #3b6dd6;
    --accent-dim: #274a94;
    --ok: #3fa66a;
    --warn: #c98a2c;
    --err: #c25450;
    --radius: 4px;
    --mono: 'SF Mono', 'Consolas', 'Roboto Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }

  .topbar {
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .topbar .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .topbar .brand svg { width: 18px; height: 18px; color: var(--accent); }

  .topbar h1 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .topbar .meta {
    font-size: 12px;
    color: var(--text-faint);
    font-family: var(--mono);
  }

  .shell {
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: calc(100vh - 53px);
  }

  .sidebar {
    border-right: 1px solid var(--border);
    padding: 20px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }

  .upload-zone {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    text-align: center;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--text-dim);
    transition: border-color 0.15s, background 0.15s;
    margin-bottom: 24px;
  }
  .upload-zone:hover { border-color: var(--accent-dim); background: var(--surface); }

  .video-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 8px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
    gap: 8px;
  }
  .video-row:hover { background: var(--surface); }
  .video-row.active { background: var(--surface-2); box-shadow: inset 2px 0 0 var(--accent); }
  .video-row .name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }

  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    flex-shrink: 0;
    display: inline-block;
  }
  .status-dot.queued { background: var(--text-faint); }
  .status-dot.processing { background: var(--warn); box-shadow: 0 0 0 3px rgba(201,138,44,0.15); }
  .status-dot.completed { background: var(--ok); }
  .status-dot.failed { background: var(--err); }

  .row-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-faint);
    text-transform: capitalize;
    flex-shrink: 0;
  }

  .empty-note { color: var(--text-faint); font-size: 12.5px; padding: 8px 0; }

  .main { padding: 28px 32px; }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .panel-header h2 { font-size: 16px; font-weight: 600; }
  .panel-header .sub { font-size: 12px; color: var(--text-faint); font-family: var(--mono); margin-top: 3px; }

  .badge {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: var(--radius);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-weight: 600;
    border: 1px solid;
  }
  .badge.queued { color: var(--text-dim); border-color: var(--border); }
  .badge.processing { color: var(--warn); border-color: rgba(201,138,44,0.35); }
  .badge.completed { color: var(--ok); border-color: rgba(63,166,106,0.35); }
  .badge.failed { color: var(--err); border-color: rgba(194,84,80,0.35); }

  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 24px;
  }
  .metric {
    background: var(--surface);
    padding: 16px 18px;
  }
  .metric .val {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 600;
    color: var(--text);
  }
  .metric .lbl {
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 4px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel h3 {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin-bottom: 16px;
  }

  .chart-row {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 20px;
  }

  table.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.data-table th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-faint);
    font-weight: 600;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  table.data-table td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
    color: var(--text-dim);
  }
  table.data-table tr:last-child td { border-bottom: none; }
  table.data-table td.num { font-family: var(--mono); color: var(--text); text-align: right; }

  canvas { max-height: 260px; }

  .placeholder {
    color: var(--text-faint);
    font-size: 13px;
    padding: 60px 0;
    text-align: center;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="10" rx="2"/><circle cx="7.5" cy="17" r="1.5"/><circle cx="16.5" cy="17" r="1.5"/></svg>
    <h1>Traffic Counter</h1>
  </div>
  <div class="meta" id="clock"></div>
</div>

<div class="shell">
  <div class="sidebar">
    <div class="section-label">Ingest</div>
    <div class="upload-zone" id="uploadBox">
      Drop a video file or click to browse
      <input type="file" id="fileInput" accept=".mp4,.mov,.avi,.mkv" style="display:none">
    </div>

    <div class="section-label">Videos</div>
    <div id="videoList"><div class="empty-note">No videos uploaded</div></div>
  </div>

  <div class="main" id="dashboard">
    <div class="placeholder">Select a video to view its analysis</div>
  </div>
</div>

<script>
let selectedId = null;
let chartInstance = null;

document.getElementById('clock').textContent = new Date().toLocaleString();

const uploadBox = document.getElementById('uploadBox');
const fileInput = document.getElementById('fileInput');

uploadBox.onclick = () => fileInput.click();
fileInput.onchange = async () => {
  const file = fileInput.files[0];
  if (!file) return;
  const form = new FormData();
  form.append('file', file);
  const original = uploadBox.textContent;
  uploadBox.textContent = 'Uploading…';
  await fetch('/upload', { method: 'POST', body: form });
  uploadBox.textContent = original;
  fileInput.value = '';
  refreshVideoList();
};

async function refreshVideoList() {
  const res = await fetch('/videos');
  const videos = await res.json();

  const listEl = document.getElementById('videoList');
  if (videos.length === 0) {
    listEl.innerHTML = '<div class="empty-note">No videos uploaded</div>';
    return;
  }

  listEl.innerHTML = videos.map(v => `
    <div class="video-row ${v.id === selectedId ? 'active' : ''}" onclick="selectVideo('${v.id}')">
      <span class="name">${v.filename}</span>
      <span class="row-status"><span class="status-dot ${v.status}"></span>${v.status}</span>
    </div>
  `).join('');

  if (!selectedId && videos.length > 0) {
    selectVideo(videos[0].id);
    return;
  }

  const current = videos.find(v => v.id === selectedId);
  if (current) renderDashboard(current);
}

function selectVideo(id) {
  selectedId = id;
  refreshVideoList();
}

async function renderDashboard(video) {
  const dashEl = document.getElementById('dashboard');

  if (video.status !== 'completed') {
    dashEl.innerHTML = `
      <div class="panel-header">
        <div>
          <h2>${video.filename}</h2>
          <div class="sub">Uploaded ${new Date(video.created_at).toLocaleString()}</div>
        </div>
        <span class="badge ${video.status}">${video.status}</span>
      </div>
      <div class="placeholder">
        ${video.status === 'failed' ? 'Processing failed. Check the server console for details.' : 'Processing in progress — this view updates automatically.'}
      </div>`;
    return;
  }

  const res = await fetch(`/videos/${video.id}/summary`);
  const summary = await res.json();
  const classEntries = Object.entries(summary.by_class);

  dashEl.innerHTML = `
    <div class="panel-header">
      <div>
        <h2>${video.filename}</h2>
        <div class="sub">Uploaded ${new Date(video.created_at).toLocaleString()}</div>
      </div>
      <span class="badge completed">completed</span>
    </div>

    <div class="metrics">
      <div class="metric"><div class="val">${summary.total_count}</div><div class="lbl">Total Count</div></div>
      ${classEntries.map(([cls, count]) => `
        <div class="metric"><div class="val">${count}</div><div class="lbl">${cls}</div></div>
      `).join('')}
    </div>

    <div class="panel">
      <h3>Class Distribution</h3>
      <div class="chart-row">
        <div><canvas id="classChart"></canvas></div>
        <table class="data-table">
          <thead><tr><th>Class</th><th>Direction</th><th style="text-align:right;">Count</th></tr></thead>
          <tbody>
            ${summary.breakdown.map(row => `
              <tr><td>${row.vehicle_class}</td><td>${row.direction}</td><td class="num">${row.count}</td></tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  const ctx = document.getElementById('classChart');
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: classEntries.map(([cls]) => cls),
      datasets: [{
        data: classEntries.map(([, count]) => count),
        backgroundColor: ['#3b6dd6', '#5c8ae0', '#7fa4e8', '#c98a2c', '#c25450'],
        borderColor: '#131417',
        borderWidth: 2,
      }]
    },
    options: {
      cutout: '68%',
      plugins: {
        legend: {
          position: 'bottom',
          labels: { color: '#9a9ca3', font: { size: 11 }, boxWidth: 10, padding: 14 }
        }
      }
    }
  });
}

refreshVideoList();
setInterval(refreshVideoList, 4000);
</script>

</body>
</html>
